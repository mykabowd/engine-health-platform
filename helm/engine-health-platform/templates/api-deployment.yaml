apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "engine-health-platform.componentName" (list .Release.Name "api") }}
  labels:
    app: {{ include "engine-health-platform.componentName" (list .Release.Name "api") }}
    component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "engine-health-platform.componentName" (list .Release.Name "api") }}
  template:
    metadata:
      labels:
        app: {{ include "engine-health-platform.componentName" (list .Release.Name "api") }}
        component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
