apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "engine-health-platform.componentName" (list .Release.Name "web") }}
  labels:
    app: {{ include "engine-health-platform.componentName" (list .Release.Name "web") }}
    component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "engine-health-platform.componentName" (list .Release.Name "web") }}
  template:
    metadata:
      labels:
        app: {{ include "engine-health-platform.componentName" (list .Release.Name "web") }}
        component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "engine-health-platform.componentName" (list .Release.Name "web-nginx") }}
