# Default nginx config used by the frontend image for docker-compose /
# plain `docker run` usage, where the backend is reachable at the
# docker-compose service name "api" on port 8000.
#
# In the Kubernetes/Helm deployment, this file is REPLACED by a ConfigMap
# rendered by the Helm chart with the real backend Service name/port
# (see helm/engine-health-platform/templates/web-nginx-configmap.yaml),
# mounted over /etc/nginx/conf.d/default.conf. This avoids fragile
# envsubst-on-nginx-variables tricks and keeps the routing config fully
# explicit and reviewable per environment.
#
# Rationale for a reverse proxy (vs. plain CORS): the frontend calls the
# same origin ("/api/*") in every environment, so there is nothing to
# configure/guess client-side, and the browser never needs cross-origin
# requests at all in this path. FastAPI's CORS middleware is *also* enabled
# (see backend/src/engine_health/main.py) purely to make local frontend dev
# (`npm run dev` on :5173 against an API on :8000, no proxy) convenient.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
